<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comedar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f7f4;
      --ink: #14262b;
      --muted: #5d6f73;
      --brand: #0f4c5c;
      --accent: #e09f3e;
      --line: #d9dfdc;
      --card: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1a1e;
        --ink: #eaf0ee;
        --muted: #93a6a9;
        --brand: #7cc3d3;
        --line: #24373c;
        --card: #13252a;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.55;
      padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
    }
    header, main, footer { width: min(720px, 100% - 2rem); margin-inline: auto; }
    header {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 1.5rem 0 1rem; border-bottom: 2px solid var(--brand);
    }
    .logo { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; color: var(--brand); }
    nav a { color: var(--muted); text-decoration: none; margin-left: 1rem; }
    nav a:hover, nav a:focus-visible { color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 4px; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    h1 { font-size: clamp(2rem, 6vw, 3rem); line-height: 1.1; letter-spacing: -0.03em; margin: 2.5rem 0 0.5rem; }
    h2.section { font-size: 1.4rem; margin: 2.5rem 0 1rem; color: var(--brand); }
    .lede { color: var(--muted); max-width: 46ch; margin: 0 0 2rem; }
    #list { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.75rem; }
    #list li { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 6px; padding: 1rem 1.1rem; }
    #list h2 { font-size: 1.1rem; margin: 0 0 0.25rem; }
    #list p { margin: 0; color: var(--muted); }
    #status, #media-status { color: var(--muted); }

    #featured[hidden] { display: none; }
    #featured video { display: block; width: 100%; height: auto; background: #000; border-radius: 8px; border: 1px solid var(--line); }

    #media-grid { display: grid; gap: 1rem; }
    .media-card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .media-card video, .media-card img { display: block; width: 100%; height: auto; background: #000; }
    .media-card audio { display: block; width: 100%; padding: 0.75rem; }
    .media-card .caption { padding: 0.6rem 0.9rem; font-size: 0.9rem; color: var(--muted); word-break: break-word; }
    .media-card a { color: var(--brand); }

    footer { padding: 3rem 0 2rem; color: var(--muted); font-size: 0.9rem; }
    @media (prefers-reduced-motion: no-preference) {
      #list li, .media-card { animation: in 0.3s ease-out both; }
      @keyframes in { from { opacity: 0; } to { opacity: 1; } }
    }
  </style>
</head>
<body>
  <header>
    <span class="logo">Comedar</span>
    <nav aria-label="Main">
      <a href="#content">Home</a>
      <a href="#media">Media</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <main id="content">
    <h1>Welcome to Comedar</h1>
    <p class="lede">Your latest content, loaded live from Cosmic.</p>

    <section id="featured" hidden>
      <h2 class="section">Featured video</h2>
      <video id="featured-video" controls playsinline preload="metadata">
        Your browser doesn't support video playback.
      </video>
    </section>

    <h2 class="section">Latest</h2>
    <p id="status" role="status">Loading…</p>
    <ul id="list"></ul>

    <section id="media">
      <h2 class="section">Media</h2>
      <p id="media-status" role="status">Loading media…</p>
      <div id="media-grid"></div>
    </section>
  </main>

  <footer id="about">
    <p>&copy; <span id="year"></span> Comedar</p>
  </footer>

  <!-- Cosmic Insights tracker: paste your tracker snippet from the Cosmic dashboard here -->

  <script type="module">
  import { createBucketClient } from "https://cdn.jsdelivr.net/npm/@cosmicjs/sdk/+esm";

  const BUCKET_SLUG = "comedar-line-production";
  const READ_KEY = "WuQoglIeDeC0aRZcnhl3lQwTvDRiv5fARDtgeswV5zDbkG75Af";
  const OBJECT_TYPE = "videos";

  document.getElementById("year").textContent = new Date().getFullYear();
  const status = document.getElementById("status");
  const list = document.getElementById("list");
  const mediaStatus = document.getElementById("media-status");
  const mediaGrid = document.getElementById("media-grid");
  const featured = document.getElementById("featured");
  const featuredVideo = document.getElementById("featured-video");

  const cosmic = createBucketClient({
    bucketSlug: BUCKET_SLUG,
    readKey: READ_KEY
  });

  async function loadObjects() {
    try {
      const { objects } = await cosmic.objects
        .find({ type: OBJECT_TYPE })
        .props("id,title,slug,metadata")
        .limit(20);

      if (!objects.length) {
        status.textContent = "No content yet. Add an object in Cosmic and reload.";
        return;
      }

      status.hidden = true;

      for (const o of objects) {
        const li = document.createElement("li");
        const h = document.createElement("h2");
        h.textContent = o.title;

        const p = document.createElement("p");
        p.textContent = o.metadata?.description || o.slug;

        li.append(h, p);
        list.append(li);
      }
    } catch (err) {
      status.textContent = "Couldn't load content. Check your bucket slug, read key, and Object type.";
      console.error(err);
    }
  }

  function renderMedia(m) {
    const type = m.type || "";
    const src = m.url;
    const card = document.createElement("div");
    card.className = "media-card";

    let el;
    if (type.startsWith("video/")) {
      el = document.createElement("video");
      el.controls = true;
      el.preload = "metadata";
      el.playsInline = true;
      el.src = src;
    } else if (type.startsWith("audio/")) {
      el = document.createElement("audio");
      el.controls = true;
      el.preload = "metadata";
      el.src = src;
    } else if (type.startsWith("image/")) {
      el = document.createElement("img");
      el.loading = "lazy";
      el.alt = m.original_name || m.name;
      el.src = m.imgix_url ? m.imgix_url + "?w=1200&auto=format" : src;
    } else {
      el = document.createElement("div");
      el.className = "caption";
      const a = document.createElement("a");
      a.href = src;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "Open file";
      el.append(a);
    }

    const cap = document.createElement("div");
    cap.className = "caption";
    cap.textContent = m.original_name || m.name;

    card.append(el, cap);
    return card;
  }

  async function loadMedia() {
    try {
      const { media } = await cosmic.media
        .find()
        .props("id,name,original_name,url,imgix_url,type")
        .limit(50);

      if (!media || !media.length) {
        mediaStatus.textContent = "No media files yet. Upload one in Cosmic and reload.";
        return;
      }

      // Use the first video in the library as the featured player
      const firstVideo = media.find((m) => (m.type || "").startsWith("video/"));
      if (firstVideo) {
        featuredVideo.src = firstVideo.url;
        featured.hidden = false;
      }

      mediaStatus.hidden = true;
      for (const m of media) {
        if (m === firstVideo) continue; // already shown in the featured player
        mediaGrid.append(renderMedia(m));
      }
    } catch (err) {
      mediaStatus.textContent = "Couldn't load media. Check that your read key has access to media.";
      console.error(err);
    }
  }

  loadObjects();
  loadMedia();
  </script>
</body>
</html>
